# Thorium-specific dependencies not included in ungoogled-chromium-windows/downloads.ini.
# Common dependencies (llvm, ninja, git, nodejs, rust, etc.) are managed by the
# ungoogled-chromium-windows submodule — keep them there and do NOT duplicate here.
#
# During the build, both files are loaded (ungoogled first, then this one) so that
# DownloadInfo merges all sections. Sections in this file supplement or selectively
# override those in the upstream file.

# libjxl — JPEG XL image decoder, removed from upstream Chromium M138, restored by Thorium
# [libjxl]
# version = 332feb17d17311c748445f7ee75c4fb55cc38530
# url = https://github.com/libjxl/libjxl/archive/%(version)s.tar.gz
# download_filename = libjxl-%(version)s.tar.gz
# output_path = third_party/libjxl/src
# strip_leading_dirs = libjxl-%(version)s

# node_modules.tar.gz — npm dependencies for WebUI build toolchain (lit-html, TypeScript, etc.)
# SHA1 object name and SHA256 from chromium/DEPS entry for src/third_party/node/node_modules.
[node_modules]
version = 38df23cf794887ca7c81d57bf30f66c38c144e28
url = https://storage.googleapis.com/chromium-nodejs/%(version)s
download_filename = node_modules-%(version)s.tar.gz
sha256 = 6781ef493aa77be4ca4824dc1d5f5157a2fbc56dacafe20914da4469f7a01b87
output_path = third_party/node/node_modules

# test_fonts — font files required by thorium_shell (content_shell with web_test support).
# These are behind the 'non_git_source' condition in Chromium's DEPS, so they are not
# downloaded when building from a git clone. SHA256 matches the DEPS sha256sum value.
[test_fonts]
url = https://storage.googleapis.com/chromium-fonts/9c07d19d9c5ee1ff94f717e6fb17e0c8c354e6f9
download_filename = test_fonts.tar.gz
sha256 = f0e9628f9e43e3f3476cde06a1849058de460e0e037b7449ce0d42b9a73c37d5
output_path = third_party/test_fonts/test_fonts