name: reusable-build
on:
  workflow_call:
    inputs:
      python-version:
        type: string
        required: false
        default: '3.12'
      x86:
        type: boolean
        required: false
        default: false
      arm:
        type: boolean
        required: false
        default: false
      simd:
        type: string
        required: false
        default: 'avx2'
      cache-key:
        type: string
        required: true
      artifact-name:
        type: string
        required: true
    secrets:
      GOOGLE_API_KEY:
        required: false
      GOOGLE_DEFAULT_CLIENT_ID:
        required: false
      GOOGLE_DEFAULT_CLIENT_SECRET:
        required: false

env:
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  GOOGLE_DEFAULT_CLIENT_ID: ${{ secrets.GOOGLE_DEFAULT_CLIENT_ID }}
  GOOGLE_DEFAULT_CLIENT_SECRET: ${{ secrets.GOOGLE_DEFAULT_CLIENT_SECRET }}

jobs:
  build-1:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          python-version: ${{ inputs.python-version }}
      - name: Restore prepared source
        uses: actions/cache/restore@v4
        with:
          path: C:\thorium-autobuild-win\build\src
          key: ${{ inputs.cache-key }}
      - name: Run Stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: false
          from_artifact: false
          x86: ${{ inputs.x86 }}
          arm: ${{ inputs.arm }}
          simd: ${{ inputs.simd }}
      - name: Upload stage state
        if: ${{ steps.stage.outputs.finished != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}-state
          path: C:\thorium-autobuild-win\build
          retention-days: 1
          compression-level: 0
          overwrite: true
      - name: Upload package
        if: ${{ steps.stage.outputs.finished == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: C:\thorium-autobuild-win\build\thorium_*
          if-no-files-found: error
    outputs:
      finished: ${{ steps.stage.outputs.finished }}

  build-2:
    needs: build-1
    if: ${{ needs.build-1.outputs.finished != 'true' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          python-version: ${{ inputs.python-version }}
      - name: Download stage state
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}-state
          path: C:\thorium-autobuild-win\build
      - name: Run Stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: ${{ join(needs.*.outputs.finished) }}
          from_artifact: true
          x86: ${{ inputs.x86 }}
          arm: ${{ inputs.arm }}
          simd: ${{ inputs.simd }}
      - name: Upload stage state
        if: ${{ steps.stage.outputs.finished != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}-state
          path: C:\thorium-autobuild-win\build
          retention-days: 1
          compression-level: 0
          overwrite: true
      - name: Upload package
