          if-no-files-found: error
      - name: Fail if build exceeded stage budget
        if: ${{ steps.stage.outputs.finished != 'true' }}
        shell: pwsh
        run: exit 1
    outputs:
      finished: ${{ steps.stage.outputs.finished }}

  complete:
    needs: build-16
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
