name: reusable-build
on:
  workflow_call:
    inputs:
      python-version:
        type: string
        required: false
        default: '3.12'
      x86:
        type: boolean
        required: false
        default: false
      arm:
        type: boolean
        required: false
        default: false
      simd:
        type: string
        required: false
        default: 'avx2'
      cache-key:
        type: string
        required: true
      artifact-name:
        type: string
        required: true
      extra-overlay-url:
        type: string
        required: false
        default: ''
    secrets:
      GOOGLE_API_KEY:
        required: false
      GOOGLE_API_KEY_REMOTING:
        required: false
      GOOGLE_API_KEY_SODA:
        required: false
      GOOGLE_DEFAULT_CLIENT_ID:
        required: false
      GOOGLE_CLIENT_ID_REMOTING:
        required: false
      GOOGLE_DEFAULT_CLIENT_SECRET:
        required: false
      GOOGLE_CLIENT_SECRET_REMOTING:
        required: false

env:
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  GOOGLE_API_KEY_REMOTING: ${{ secrets.GOOGLE_API_KEY_REMOTING }}
  GOOGLE_API_KEY_SODA: ${{ secrets.GOOGLE_API_KEY_SODA }}
  GOOGLE_DEFAULT_CLIENT_ID: ${{ secrets.GOOGLE_DEFAULT_CLIENT_ID }}
  GOOGLE_CLIENT_ID_REMOTING: ${{ secrets.GOOGLE_CLIENT_ID_REMOTING }}
  GOOGLE_DEFAULT_CLIENT_SECRET: ${{ secrets.GOOGLE_DEFAULT_CLIENT_SECRET }}
  GOOGLE_CLIENT_SECRET_REMOTING: ${{ secrets.GOOGLE_CLIENT_SECRET_REMOTING }}
  THORIUM_EXTRA_OVERLAY_URL: ${{ inputs.extra-overlay-url }}

jobs:
  build-1:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          python-version: ${{ inputs.python-version }}
      - name: Restore prepared source
        uses: actions/cache/restore@v4
        with:
          path: C:\tbw\build\src
          key: ${{ inputs.cache-key }}
      - name: Run Stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: false
          from_artifact: false
          x86: ${{ inputs.x86 }}
          arm: ${{ inputs.arm }}
          simd: ${{ inputs.simd }}
      - name: Upload package
        if: ${{ steps.stage.outputs.finished == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: C:\tbw\build\thorium_*
          if-no-files-found: error
    outputs:
      finished: ${{ steps.stage.outputs.finished }}

  build-2:
    needs: build-1
    if: ${{ needs.build-1.outputs.finished != 'true' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          python-version: ${{ inputs.python-version }}
      - name: Run Stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: ${{ join(needs.*.outputs.finished) }}
          from_artifact: true
          x86: ${{ inputs.x86 }}
          arm: ${{ inputs.arm }}
          simd: ${{ inputs.simd }}
      - name: Upload package
        if: ${{ steps.stage.outputs.finished == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: C:\tbw\build\thorium_*
