          arm: ${{ inputs.arm }}
          simd: ${{ inputs.simd }}
    outputs:
      finished: ${{ steps.stage.outputs.finished }}

  build-7:
    needs: build-6
    if: ${{ needs.build-6.outputs.finished != 'true' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          python-version: ${{ inputs.python-version }}
      - name: Run Stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: ${{ join(needs.*.outputs.finished) }}
          from_artifact: true
          x86: ${{ inputs.x86 }}
          arm: ${{ inputs.arm }}
          simd: ${{ inputs.simd }}
    outputs:
      finished: ${{ steps.stage.outputs.finished }}

  build-8:
    needs: build-7
    if: ${{ needs.build-7.outputs.finished != 'true' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          python-version: ${{ inputs.python-version }}
      - name: Run Stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: ${{ join(needs.*.outputs.finished) }}
          from_artifact: true
          x86: ${{ inputs.x86 }}
          arm: ${{ inputs.arm }}
          simd: ${{ inputs.simd }}
    outputs:
      finished: ${{ steps.stage.outputs.finished }}

  build-9:
    needs: build-8
    if: ${{ needs.build-8.outputs.finished != 'true' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          python-version: ${{ inputs.python-version }}
      - name: Run Stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: ${{ join(needs.*.outputs.finished) }}
          from_artifact: true
          x86: ${{ inputs.x86 }}
          arm: ${{ inputs.arm }}
          simd: ${{ inputs.simd }}
    outputs:
      finished: ${{ steps.stage.outputs.finished }}

  finalize:
    needs:
      - build-1
      - build-2
      - build-3
      - build-4
      - build-5
      - build-6
      - build-7
      - build-8
      - build-9
    if: ${{ always() && contains(needs.*.outputs.finished, 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Build completed
        run: echo "Thorium build completed successfully!"
