name: publish-release
on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Override target tag (optional, auto-detected from builds otherwise)'
        required: false
        default: ''
      target_sha:
        description: 'Override target commit SHA (optional, auto-detected from builds otherwise)'
        required: false
        default: ''
  workflow_run:
    workflows:
      - build-x64-avx2
      - build-x64-sse4
      - build-x86
      - build-arm64
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  resolve-release-context:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.context.outputs.ready }}
      publishable: ${{ steps.runs.outputs.publishable }}
      target_tag: ${{ steps.context.outputs.target_tag }}
      target_sha: ${{ steps.context.outputs.target_sha }}
      x64_sse4_run_id: ${{ steps.runs.outputs.x64_sse4_run_id }}
      x64_avx2_run_id: ${{ steps.runs.outputs.x64_avx2_run_id }}
      x86_run_id: ${{ steps.runs.outputs.x86_run_id }}
      arm_run_id: ${{ steps.runs.outputs.arm_run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Resolve target tag
        id: context
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF_TYPE: ${{ github.ref_type }}
          DISPATCH_REF_NAME: ${{ github.ref_name }}
          DISPATCH_SHA: ${{ github.sha }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          MANUAL_TARGET_TAG: ${{ inputs.target_tag }}
          MANUAL_TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$MANUAL_TARGET_TAG" ] && [ -n "$MANUAL_TARGET_SHA" ]; then
              target_tag="$MANUAL_TARGET_TAG"
              target_sha="$MANUAL_TARGET_SHA"
            elif [ "$DISPATCH_REF_TYPE" != "tag" ]; then
              echo "Manual publish only runs on a tag ref. Current ref type: $DISPATCH_REF_TYPE"
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            else
              target_tag="$DISPATCH_REF_NAME"
              target_sha="$DISPATCH_SHA"
            fi
          else
            if [ "$WORKFLOW_RUN_HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
              echo "Triggered by a fork run; skipping publish."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            target_sha="$WORKFLOW_RUN_HEAD_SHA"
            candidate_tag="$WORKFLOW_RUN_HEAD_BRANCH"

            if [ -z "$candidate_tag" ] || ! git rev-parse -q --verify "refs/tags/$candidate_tag" >/dev/null; then
              echo "Upstream run was not triggered from a tag ref; skipping publish."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            tag_sha="$(git rev-list -n 1 "$candidate_tag")"
            if [ "$tag_sha" != "$target_sha" ]; then
              echo "Tag $candidate_tag does not point to $target_sha; skipping publish."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            target_tag="$candidate_tag"
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "target_tag=$target_tag" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $target_tag"
          echo "Resolved sha: $target_sha"

      - name: Locate latest successful builds
        id: runs
        if: ${{ steps.context.outputs.ready == 'true' }}
        uses: actions/github-script@v8
        env:
          TARGET_SHA: ${{ steps.context.outputs.target_sha }}
        with:
          script: |
            const workflows = [
              { key: 'x64_sse4', file: 'build-x64-sse4.yml', simd: 'sse4', optional: true },
              { key: 'x64_avx2', file: 'build-x64-avx2.yml', simd: 'avx2', optional: false },
              { key: 'x86', file: 'build-x86.yml', simd: 'x86', optional: true },
              { key: 'arm', file: 'build-arm64.yml', simd: 'arm', optional: true },
            ];
            const targetSha = process.env.TARGET_SHA;
            const outputs = { publishable: 'true' };

            for (const workflow of workflows) {
              const matches = [];
              for (let page = 1; page <= 10; page++) {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: workflow.file,
                  per_page: 100,
                  page,
                  status: 'completed',
                });

                matches.push(...data.workflow_runs.filter((run) =>
                  run.head_sha === targetSha &&
                  run.conclusion === 'success' &&
                  run.event === 'push'
                ));

                if (data.workflow_runs.length < 100) {
                  break;
                }
              }

              matches.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
              const latest = matches[0];
              if (!latest) {
                if (workflow.optional) {
                  core.info(`Optional workflow ${workflow.file} (${workflow.simd}) not found, skipping.`);
                  outputs[`${workflow.key}_run_id`] = '';
                  continue;
                }
                core.info(`No successful run found for ${workflow.file} at ${targetSha}`);
                outputs.publishable = 'false';
                continue;
              }

              core.info(`Using ${workflow.file} run ${latest.id} from ${latest.created_at}`);
              outputs[`${workflow.key}_run_id`] = String(latest.id);
            }

            for (const [name, value] of Object.entries(outputs)) {
              core.setOutput(name, value);
            }

  publish-release:
    needs: resolve-release-context
    if: ${{ needs.resolve-release-context.outputs.ready == 'true' && needs.resolve-release-context.outputs.publishable == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # Download all x64 SIMD variants
      - name: Download x64 SSE4 package
        if: ${{ needs.resolve-release-context.outputs.x64_sse4_run_id != '' }}
        uses: actions/download-artifact@v7
        with:
          name: thorium-sse4
          path: artifacts/x64/sse4
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-release-context.outputs.x64_sse4_run_id }}

      - name: Download x64 AVX2 package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="${{ needs.resolve-release-context.outputs.x64_avx2_run_id }}"
          mkdir -p artifacts/x64/avx2
          gh run download "$RUN_ID" --repo ${{ github.repository }} \
            -n thorium-avx2 -D artifacts/x64/avx2 2>/dev/null \
            || gh run download "$RUN_ID" --repo ${{ github.repository }} \
              -n thorium -D artifacts/x64/avx2

      - name: Download x86 package
        if: ${{ needs.resolve-release-context.outputs.x86_run_id != '' }}
        uses: actions/download-artifact@v7
        with:
          name: thorium-x86
          path: artifacts/x86
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-release-context.outputs.x86_run_id }}

      - name: Download arm64 package
        if: ${{ needs.resolve-release-context.outputs.arm_run_id != '' }}
        uses: actions/download-artifact@v7
        with:
          name: thorium-arm64
          path: artifacts/arm64
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-release-context.outputs.arm_run_id }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-release-context.outputs.target_tag }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            artifacts/**/thorium*

      - name: Generate release notes
        run: |
          echo "## Thorium Release ${{ needs.resolve-release-context.outputs.target_tag }}" > release-notes.md
          echo "" >> release-notes.md
          echo "### Downloads" >> release-notes.md
          find artifacts -name 'thorium*' -exec basename {} \; 2>/dev/null | while IFS= read -r f; do echo "- \`$f\`" >> release-notes.md; done
          # Fallback if no files found
          if ! grep -q '^- `' release-notes.md; then
            echo "- See release assets below for available builds." >> release-notes.md
          fi
