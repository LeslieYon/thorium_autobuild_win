name: test-build-x64-avx2

on:
  workflow_dispatch:
    inputs:
      python-version:
        description: Python version for the build environment
        required: false
        default: '3.12'
      extra-overlay-url:
        description: URL to a compressed archive applied as extra overlay after the standard overlay/
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: test-build-x64-avx2-${{ github.ref }}
  cancel-in-progress: true

env:
  THORIUM_EXTRA_OVERLAY_URL: ${{ inputs['extra-overlay-url'] }}

jobs:
  prepare:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          python-version: ${{ inputs['python-version'] }}
      - name: Restore source cache
        id: source-cache
        uses: actions/cache@v5
        with:
          path: C:\tbw\build\src
          key: thorium-src-test-x64-avx2-${{ github.sha }}
      - name: Prepare Chromium source
        if: ${{ steps.source-cache.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: python build.py --ci --prepare-only --simd avx2
        working-directory: C:\tbw
        env:
          THORIUM_EXTRA_OVERLAY_URL: ${{ inputs['extra-overlay-url'] }}

  build-avx2:
    needs: prepare
    uses: ./.github/workflows/reusable-build.yml
    with:
      python-version: ${{ inputs['python-version'] }}
      simd: avx2
      cache-key: thorium-src-test-x64-avx2-${{ github.sha }}
      artifact-name: thorium-test-x64-avx2
      extra-overlay-url: ${{ inputs['extra-overlay-url'] }}
    secrets:
      GOOGLE_API_KEY: ${{ secrets['GOOGLE_API_KEY'] }}
      GOOGLE_API_KEY_REMOTING: ${{ secrets['GOOGLE_API_KEY_REMOTING'] }}
      GOOGLE_API_KEY_SODA: ${{ secrets['GOOGLE_API_KEY_SODA'] }}
      GOOGLE_DEFAULT_CLIENT_ID: ${{ secrets['GOOGLE_DEFAULT_CLIENT_ID'] }}
      GOOGLE_CLIENT_ID_REMOTING: ${{ secrets['GOOGLE_CLIENT_ID_REMOTING'] }}
      GOOGLE_DEFAULT_CLIENT_SECRET: ${{ secrets['GOOGLE_DEFAULT_CLIENT_SECRET'] }}
      GOOGLE_CLIENT_SECRET_REMOTING: ${{ secrets['GOOGLE_CLIENT_SECRET_REMOTING'] }}
