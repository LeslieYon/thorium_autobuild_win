name: 'Prepare Thorium Build Environment'
description: 'Checkout sources, set up Python, copy workspace, and install stage dependencies'
inputs:
  python-version:
    description: 'Python version'
    required: false
    default: '3.12'
runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Init - Copy workspace to C:\\
      shell: pwsh
      run: |
        if (Test-Path 'C:\thorium-autobuild-win') {
          Remove-Item 'C:\thorium-autobuild-win' -Recurse -Force
        }
        Copy-Item -Path $env:GITHUB_WORKSPACE -Destination 'C:\thorium-autobuild-win' -Recurse

    - name: Setup Stage
      shell: pwsh
      run: npm install
      working-directory: C:\thorium-autobuild-win\.github\actions\stage
